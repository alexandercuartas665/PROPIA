name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "9.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ---------------------------------------------------------------------------
  # Build + unit tests + integration tests (incluyendo TenantIsolationTests
  # con Testcontainers contra PostgreSQL real). Bloqueante para merge.
  # ---------------------------------------------------------------------------
  build-test:
    name: Build, test y aislamiento multi-tenant
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Test (incluye TenantIsolationTests via Testcontainers)
        # Testcontainers detecta Docker automaticamente en GitHub Actions runners
        # (vienen con Docker preinstalado). Los TenantIsolationTests son CRITICOS:
        # validan que RLS de PostgreSQL aisla los datos entre copropiedades.
        # Si fallan, bloquean el merge porque indican un agujero de seguridad.
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal" --collect "XPlat Code Coverage"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: tests/**/TestResults/**/coverage.cobertura.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Verifica formato de codigo - bloquea PR si hay archivos sin formatear.
  # ---------------------------------------------------------------------------
  format-check:
    name: Verificar formato (dotnet format)
    runs-on: ubuntu-latest
    needs: []  # paralelo a build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: dotnet format verify (errors only)
        # Severidad "error" - bloquea solo problemas de formato reales, no warnings
        # de analyzers como EF1002 (SQL raw en tests es intencional).
        run: dotnet format --verify-no-changes --severity error --no-restore
