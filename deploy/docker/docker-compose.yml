name: propia-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: propia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: propia_dev
      POSTGRES_USER: propia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propia -d propia_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - propia-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: propia-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@propia.com.co
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - propia-net

  redis:
    image: redis:7-alpine
    container_name: propia-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - propia-net

volumes:
  postgres-data:
  pgadmin-data:
  redis-data:

networks:
  propia-net:
    driver: bridge
